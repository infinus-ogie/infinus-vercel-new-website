name: CI

# Regression safety gate for the bilingual/privacy project. Validation only:
# this workflow never deploys, never publishes, and never writes to the repository.
#
# It runs the three checks established in Phases A1 and A2:
#   1. unit tests            (test/**, 61 tests)
#   2. production build      (next build + next-sitemap postbuild)
#   3. SEO regression harness (scripts/seo/**, 455 assertions)
#
# `npm run type-check` is deliberately NOT a gate yet: the repository has one
# pre-existing type error (scripts/qa/ga4-smoke.spec.ts:77 accesses error.message on
# an `unknown` catch variable), so adding it now would make CI red on its first run.
# It should become a required step in the same change that fixes that error.

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/infinus-bilingual-privacy]

# Least privilege: the job only reads the repository.
permissions:
  contents: read

# Supersede in-flight runs for the same ref so rapid pushes do not queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, build and SEO harness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 20 LTS. The repository declares no `engines` field and no .nvmrc, so
          # this pins what the project is actually developed against (local dev runs
          # v20.20.0) and satisfies Next 14.0.4's >=18.17 requirement. Keep this in
          # step with the Node version configured for the Vercel project.
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` for a reproducible install from package-lock.json (lockfileVersion 3).
        # .npmrc sets legacy-peer-deps=true and npm ci honours it, so no extra flags.
        run: npm ci

      - name: Unit tests
        run: npm test -- --run

      - name: Production build
        # Runs `next build` and, via the postbuild hook, `next-sitemap`.
        #
        # No environment variables are required: the build was verified to succeed in a
        # clean checkout with no .env files present. Every NEXT_PUBLIC_* value is
        # optional at compile time, and no SEO output depends on one — the production
        # origin is hardcoded in lib/jsonld.ts and next-sitemap.config.js. Nothing here
        # needs a secret, and none is provided.
        #
        # Note: app/layout.tsx uses next/font/google, so this step performs a build-time
        # fetch to fonts.googleapis.com. That fetch is occasionally flaky and can fail
        # with "An error occured in `next/font`" on an otherwise valid commit; re-running
        # the job is the correct response.
        run: npm run build

      - name: SEO regression harness
        # Must run after the build: it validates the generated .next output against
        # test/fixtures/routes.ts. Runs in the same job so .next persists between steps —
        # no artifact upload/download needed.
        #
        # Compare-only. `seo:snapshot-head` without --write never rewrites
        # scripts/seo/baseline/head-baseline.json, so the committed baseline is the
        # authority and CI cannot silently re-baseline a regression away.
        run: npm run seo:check
